# Configuração do pacman usada pelo mkarchiso para montar a ISO.
# Somente repositórios oficiais. multilib é habilitado para bibliotecas de 32 bits
# que alguns jogos e apps proprietários exigem.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
