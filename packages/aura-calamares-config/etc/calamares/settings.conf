# Configuração principal do instalador do Aura OS.
---
modules-search: [ local ]

instances:
  - id: cleanup-live
    module: shellprocess
    config: cleanup-live.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - removeuser
      - users
      - displaymanager
      - services-systemd
      - shellprocess@cleanup-live
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: aura
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
