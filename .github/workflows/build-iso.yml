# Pipeline do Aura OS: testes do aura-dl e build da ISO.
# O usuário não precisa de um host Arch: o build roda em container oficial.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aura-dl:
    name: aura-dl (fmt, clippy, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura-dl
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aura-dl

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy sem avisos
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        run: cargo test --locked

  iso:
    name: build da ISO
    runs-on: ubuntu-latest
    needs: aura-dl
    # Imagem oficial do Arch: as ferramentas (archiso, shellcheck) vêm dos
    # repositórios oficiais, sem AUR. --privileged é necessário porque o
    # mkarchiso monta sistemas de arquivos e cria loop devices.
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Atualizar keyring e sistema
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring

      - name: Instalar dependências de build
        run: pacman -S --noconfirm --needed archiso shellcheck git

      - uses: actions/checkout@v4

      - name: Lint dos scripts de shell
        # O host nativo é Python e não entra aqui: shellcheck só analisa shell.
        run: shellcheck iso/build.sh iso/profiledef.sh iso/airootfs/root/customize_airootfs.sh iso/airootfs/usr/local/bin/aura-first-boot

      - name: Construir a ISO
        working-directory: iso
        run: |
          # Permite que o git leia o repositório clonado dentro do container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Data do último commit: a ISO fica idêntica para o mesmo commit.
          SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct)" bash ./build.sh

      - name: Enviar a ISO como artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-os-iso
          path: iso/out/*
          if-no-files-found: error

  boot-smoke:
    name: boot da ISO (QEMU)
    runs-on: ubuntu-latest
    needs: iso
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura-os-iso
          path: iso/out

      - name: Instalar QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Iniciar a live em modo headless
        run: |
          iso="$(find iso/out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"

          set +e
          timeout --signal=TERM 300 \
            qemu-system-x86_64 \
              -machine accel=tcg \
              -m 2048 -smp 2 \
              -display none \
              -serial stdio \
              -cdrom "${iso}" \
              -boot d \
              > boot.log 2>&1
          status=$?
          set -e

          # O systemd colore a saída; removemos ANSI antes de procurar os marcos.
          sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' boot.log > boot.clean.log
          cat boot.clean.log

          if grep -Fq 'Please configure the system!' boot.clean.log; then
            echo "erro: a live parou no assistente systemd-firstboot" >&2
            exit 1
          fi

          if ! grep -Eq 'Started Light Display Manager|Reached target Graphical Interface|login:' boot.clean.log; then
            echo "erro: a live não chegou ao gerenciador gráfico (qemu status ${status})" >&2
            exit 1
          fi
