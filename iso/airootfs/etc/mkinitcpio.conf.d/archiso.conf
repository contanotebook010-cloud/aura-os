# Configuração do initramfs gerado pela mkinitcpio-archiso.
# Os hooks archiso localizam a imagem squashfs, montam o cowspace e
# transferem o controle para o sistema live. Sem o hook "archiso", o serviço
# switch-root falha porque não existe uma raiz de arquivo para montar.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
