# Configuração de boot BIOS legado (syslinux). Os placeholders %INSTALL_DIR% e
# %ARCHISO_UUID% são substituídos pelo mkarchiso durante o build.
# Sem splash.png: a imagem de fundo do menu foi omitida para não depender de binário.
# Memtest fica de fora por enquanto; pode ser adicionado depois com o caminho confirmado.

DEFAULT aura
PROMPT 0
TIMEOUT 300
SERIAL 0 115200

UI vesamenu.c32
MENU TITLE Aura OS

LABEL aura
  MENU LABEL Aura OS (live, x86_64)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
