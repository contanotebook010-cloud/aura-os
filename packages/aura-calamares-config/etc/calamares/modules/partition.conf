# Particionamento do Aura OS. A ESP segue a convenção do Arch e é montada em /boot.
---
efi:
  mountPoint: /boot
  recommendedSize: 512MiB
  minimumSize: 128MiB
  label: EFI

userSwapChoices:
  - none
  - small
  - file

luksGeneration: luks2
defaultFileSystemType: ext4
initialPartitioningChoice: none
initialSwapChoice: none
allowManualPartitioning: true
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
essentialMounts:
  - live-*
  - control
  - ventoy

lvm:
  enable: true

requiredStorage: 8.0
