# Conta de usuário criada pelo instalador.
---
defaultGroups:
  - users
  - lp
  - video
  - network
  - storage
  - wheel
  - audio

autologinGroup: ""
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 128
  libpwquality:
    - minlen=8
    - minclass=2

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - nobody
  home_permissions: o750

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-${product}"
  forbidden_names:
    - localhost

allowActiveDirectory: false
