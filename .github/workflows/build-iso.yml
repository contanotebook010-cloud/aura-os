# Pipeline do Aura OS: testes do aura-dl e build da ISO.
# O usuário não precisa de um host Arch: o build roda em container oficial.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aura-dl:
    name: aura-dl (fmt, clippy, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura-dl
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aura-dl

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy sem avisos
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        run: cargo test --locked

      - name: Testes da ponte do navegador
        working-directory: browser/aura-dl-bridge
        run: python3 -m unittest discover -s tests -v

  iso:
    name: build da ISO
    runs-on: ubuntu-latest
    needs: aura-dl
    # Imagem oficial do Arch: as ferramentas (archiso, shellcheck) vêm dos
    # repositórios oficiais, sem AUR. --privileged é necessário porque o
    # mkarchiso monta sistemas de arquivos e cria loop devices.
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Atualizar keyring e sistema
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring

      - name: Instalar dependências de build
        run: >-
          pacman -S --noconfirm --needed
          archiso base-devel git libarchive rust shellcheck curl
          cmake extra-cmake-modules libglvnd ninja python
          qt6-tools qt6-translations
          kcoreaddons kpmcore libpwquality polkit-qt6
          qt6-svg yaml-cpp python-yaml python-jsonschema

      - uses: actions/checkout@v4

      - name: Lint dos scripts de shell
        # O host nativo é Python e não entra aqui: shellcheck só analisa shell.
        run: |
          shellcheck \
            iso/build.sh \
            iso/profiledef.sh \
            iso/airootfs/root/customize_airootfs.sh \
            iso/airootfs/usr/local/bin/aura-first-boot \
            iso/airootfs/usr/local/bin/aura-install-cleanup \
            iso/airootfs/usr/local/bin/aura-session-ready \
            packages/build-local-repo.sh \
            packages/aura-dl/PKGBUILD \
            packages/aura-dl-bridge/PKGBUILD \
            packages/calamares/PKGBUILD \
            packages/aura-calamares-config/PKGBUILD

      - name: Validar a configuração do Calamares
        run: python packages/validate-calamares-config.py

      - name: Construir a ISO
        working-directory: iso
        run: |
          # Permite que o git leia o repositório clonado dentro do container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Data do último commit: a ISO fica idêntica para o mesmo commit.
          SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct)" bash ./build.sh

      - name: Enviar a ISO como artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-os-iso
          path: iso/out/*
          if-no-files-found: error

  boot-smoke:
    name: boot da ISO (QEMU)
    runs-on: ubuntu-latest
    needs: iso
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura-os-iso
          path: iso/out

      - name: Instalar QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Iniciar a live e validar XFCE, preset e Calamares
        run: |
          iso="$(find iso/out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${iso}"

          qemu-system-x86_64 \
            -machine accel=tcg \
            -m 4096 -smp 2 \
            -display none \
            -vga std \
            -monitor none \
            -serial stdio \
            -cdrom "${iso}" \
            -boot d \
            -no-reboot \
            > boot.log 2>&1 &
          qemu_pid=$!

          # A imagem publica os três marcadores somente quando a sessão XFCE
          # real existe, o preset clássico está aplicado e o Calamares abre.
          deadline=$((SECONDS + 600))
          while ((SECONDS < deadline)); do
            if grep -Fq 'AURA_XFCE_SMOKE_OK' boot.log \
              || grep -Fq 'AURA_XFCE_SMOKE_FAILED' boot.log; then
              break
            fi
            if ! kill -0 "${qemu_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "${qemu_pid}" 2>/dev/null; then
            kill -TERM "${qemu_pid}"
          fi
          if wait "${qemu_pid}"; then
            status=0
          else
            status=$?
          fi

          # O systemd colore a saída; removemos ANSI antes de procurar os marcos.
          sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' boot.log > boot.clean.log
          cat boot.clean.log

          if grep -Fq 'Please configure the system!' boot.clean.log; then
            echo "erro: a live parou no assistente systemd-firstboot" >&2
            exit 1
          fi

          if grep -Fq 'AURA_XFCE_SMOKE_FAILED' boot.clean.log; then
            echo "erro: a sessão XFCE não satisfaz o smoke test (qemu status ${status})" >&2
            exit 1
          fi

          for marker in \
            AURA_XFCE_PRESET_OK \
            AURA_CALAMARES_OK \
            AURA_XFCE_SMOKE_OK; do
            if ! grep -Fq "${marker}" boot.clean.log; then
              echo "erro: timeout sem ${marker} (qemu status ${status})" >&2
              exit 1
            fi
          done

      - name: Enviar os logs do smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-os-boot-smoke-logs
          path: |
            boot.log
            boot.clean.log
          if-no-files-found: warn
          retention-days: 7
