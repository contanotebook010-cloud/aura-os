# Extrai a rootfs e o kernel da própria ISO live para o destino.
---
unpack:
  - source: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs
    sourcefs: squashfs
    destination: ""
    weight: 20
    exclude:
      - /etc/mkinitcpio.conf.d/archiso.conf
      - /etc/systemd/system/aura-session-ready.service
      - /etc/systemd/system/aura-session-ready.timer
  - source: /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux
    sourcefs: file
    destination: /boot/vmlinuz-linux
    weight: 1
